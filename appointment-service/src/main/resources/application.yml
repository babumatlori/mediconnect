server:
  port: 8083

spring:
  application:
    name: appointment-service


  datasource:
    url: jdbc:mysql://localhost:3306/appointment_db
    username: root
    password: ${DB_PASSWORD:BabuMatlori@123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        formate_sql: true

#        Redis configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 hour in milliseconds

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    instance:
      prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.mediconnect: DEBUG