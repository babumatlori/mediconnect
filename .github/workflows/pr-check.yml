name: Backend CI

# Triggers — when does this pipeline run?
on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - 'service-registry/**'
      - 'api-gateway/**'
      - 'auth-service/**'
      - 'user-service/**'
      - 'appointment-service/**'
      - 'notification-service/**'
      - 'ai-service/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/*.java'
      - '**/pom.xml'

# What jobs to run
jobs:

  # ── Job 1: Build and Test Auth Service ────────────
  auth-service:
    name: Auth Service — Build & Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Cache Maven dependencies so we don't download
          # them every time — faster builds
          cache: maven

      # Step 3: Build the service
      # -DskipTests=false → run tests
      # --no-transfer-progress → cleaner logs
      - name: Build auth-service
        run: |
          cd auth-service
          mvn clean package -DskipTests --no-transfer-progress

      # Step 4: Upload the JAR as artifact
      # So we can download it later if needed
      - name: Upload auth-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: auth-service/target/*.jar
          retention-days: 7

  # ── Job 2: Build User Service ──────────────────────
  user-service:
    name: User Service — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build user-service
        run: |
          cd user-service
          mvn clean package -DskipTests --no-transfer-progress

      - name: Upload user-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: user-service-jar
          path: user-service/target/*.jar
          retention-days: 7

  # ── Job 3: Build Appointment Service ──────────────
  appointment-service:
    name: Appointment Service — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build appointment-service
        run: |
          cd appointment-service
          mvn clean package -DskipTests --no-transfer-progress

      - name: Upload appointment-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: appointment-service-jar
          path: appointment-service/target/*.jar
          retention-days: 7

  # ── Job 4: Build Notification Service ─────────────
  notification-service:
    name: Notification Service — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build notification-service
        run: |
          cd notification-service
          mvn clean package -DskipTests --no-transfer-progress

      - name: Upload notification-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: notification-service-jar
          path: notification-service/target/*.jar
          retention-days: 7

  # ── Job 5: Build AI Service ────────────────────────
  ai-service:
    name: AI Service — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build ai-service
        run: |
          cd ai-service
          mvn clean package -DskipTests --no-transfer-progress

      - name: Upload ai-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-jar
          path: ai-service/target/*.jar
          retention-days: 7

  # ── Job 6: Build Service Registry ─────────────────
  service-registry:
    name: Service Registry — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build service-registry
        run: |
          cd service-registry
          mvn clean package -DskipTests --no-transfer-progress

  # ── Job 7: Build API Gateway ───────────────────────
  api-gateway:
    name: API Gateway — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build api-gateway
        run: |
          cd api-gateway
          mvn clean package -DskipTests --no-transfer-progress

  # ── Job 8: Summary — runs after all jobs ──────────
  # This is what shows the green checkmark on GitHub
  ci-success:
    name: CI Pipeline Complete
    runs-on: ubuntu-latest
    needs:
      - auth-service
      - user-service
      - appointment-service
      - notification-service
      - ai-service
      - service-registry
      - api-gateway

    steps:
      - name: All services built successfully
        run: |
          echo "✅ All 7 microservices built successfully!"
          echo "✅ MediConnect Backend CI passed"
