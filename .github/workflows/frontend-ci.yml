name: Frontend CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:

  frontend-build:
    name: Frontend — Build & Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache node_modules — much faster builds
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
        # npm ci is faster than npm install
        # uses package-lock.json exactly

      # Step 4: Create .env for build
      # We use dummy values — just need it to build
      - name: Create environment file
        run: |
          cd frontend
          echo "VITE_API_BASE_URL=http://localhost:8080" > .env
          echo "VITE_NOTIFICATION_WS_URL=http://localhost:8084" >> .env
          echo "VITE_AI_WS_URL=http://localhost:8085" >> .env
          echo "VITE_APP_NAME=MediConnect" >> .env

      # Step 5: Build for production
      - name: Build production bundle
        run: |
          cd frontend
          npm run build

      # Step 6: Upload built files
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

      # Step 7: Report bundle size
      - name: Report bundle size
        run: |
          echo "📦 Frontend bundle size:"
          du -sh frontend/dist/
          echo "📄 Files generated:"
          ls -la frontend/dist/assets/ | head -20
