name: Backend CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
    paths:
      - 'service-registry/**'
      - 'api-gateway/**'
      - 'auth-service/**'
      - 'user-service/**'
      - 'appointment-service/**'
      - 'notification-service/**'
      - 'ai-service/**'
      - '.github/workflows/**'
      - '.github/maven-settings.xml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '.github/workflows/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  auth-service:
    name: Auth Service — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build auth-service
        run: |
          cd auth-service
          mvn clean package -DskipTests --no-transfer-progress \
            --settings ../.github/maven-settings.xml
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: auth-service-jar
          path: auth-service/target/*.jar
          retention-days: 7

  user-service:
    name: User Service — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build user-service
        run: |
          cd user-service
          mvn clean package -DskipTests --no-transfer-progress \
            --settings ../.github/maven-settings.xml
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: user-service-jar
          path: user-service/target/*.jar
          retention-days: 7

  appointment-service:
    name: Appointment Service — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build appointment-service
        run: |
          cd appointment-service
          mvn clean package -DskipTests --no-transfer-progress \
            --settings ../.github/maven-settings.xml
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: appointment-service-jar
          path: appointment-service/target/*.jar
          retention-days: 7

  notification-service:
    name: Notification Service — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build notification-service
        run: |
          cd notification-service
          mvn clean package -DskipTests --no-transfer-progress \
            --settings ../.github/maven-settings.xml
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: notification-service-jar
          path: notification-service/target/*.jar
          retention-days: 7

  ai-service:
    name: AI Service — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build ai-service
        run: |
          cd ai-service
          mvn clean package -DskipTests --no-transfer-progress \
            --settings ../.github/maven-settings.xml
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ai-service-jar
          path: ai-service/target/*.jar
          retention-days: 7

  service-registry:
    name: Service Registry — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build service-registry
        run: |
          cd service-registry
          mvn clean package -DskipTests --no-transfer-progress \
            --settings ../.github/maven-settings.xml

  api-gateway:
    name: API Gateway — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build api-gateway
        run: |
          cd api-gateway
          mvn clean package -DskipTests --no-transfer-progress \
            --settings ../.github/maven-settings.xml

  ci-success:
    name: CI Pipeline Complete
    runs-on: ubuntu-latest
    needs:
      - auth-service
      - user-service
      - appointment-service
      - notification-service
      - ai-service
      - service-registry
      - api-gateway
    steps:
      - name: All services built successfully
        run: |
          echo "✅ All 7 microservices built successfully!"
          echo "✅ MediConnect Backend CI passed"
